name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Linting & Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: darukaa_db_test
          POSTGRES_USER: darukaa_user
          POSTGRES_PASSWORD: darukaa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Code Quality & Formatting Checks
        run: |
          cd backend
          ruff check app tests

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: postgresql://darukaa_user:darukaa_password@localhost:5432/darukaa_db_test
          SECRET_KEY: ci-test-secret-key-2026
        run: |
          cd backend
          pytest -v

  frontend-ci:
    name: Frontend Linting & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Verify Production Bundle Build
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_MAPBOX_TOKEN: pk.eyJ1IjoiZGVtb3VzZXIiLCJhIjoiY2x4ZGVtb3NhbXBsZXRva2VuMDExIn0.demo_public_token
        run: |
          cd frontend
          npm run build
