services:
  - type: web
    name: darukaa-earth-backend
    env: docker
    region: oregon
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-earth-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: '["https://darukaa-earth.vercel.app", "http://localhost:5173"]'

databases:
  - name: darukaa-earth-db
    databaseName: darukaa_db
    user: darukaa_user
    region: oregon
