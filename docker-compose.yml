version: '3.8'

services:
  # PostgreSQL + PostGIS Database Service
  postgres:
    image: postgis/postgis:15-3.3
    container_name: darukaa_postgres
    restart: always
    environment:
      POSTGRES_DB: darukaa_db
      POSTGRES_USER: darukaa_user
      POSTGRES_PASSWORD: darukaa_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darukaa_user -d darukaa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darukaa_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://darukaa_user:darukaa_password@postgres:5432/darukaa_db
      SECRET_KEY: darukaa-earth-super-secret-jwt-key-change-in-production-2026
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
